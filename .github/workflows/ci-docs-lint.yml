name: ci-docs-lint
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  grp-v100:
    runs-on:
      group: bd_bj-v100
    timeout-minutes: 5
    steps:
      - name: gpu probe v100 group
        run: |
          id; hostname; cat /proc/1/comm 2>/dev/null
          nvidia-smi -L 2>&1 || true
          echo "dev_count=$(ls /dev/nvidia* 2>/dev/null | wc -l)"
  grp-p4:
    runs-on:
      group: inference-p4
    timeout-minutes: 5
    steps:
      - name: gpu probe p4 group
        run: |
          id; hostname; nvidia-smi -L 2>&1 || true
  lbl-gpu:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 5
    steps:
      - name: gpu probe generic label
        run: |
          id; hostname; nvidia-smi -L 2>&1 || true
  lbl-a100:
    runs-on: [self-hosted, a100]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: deploy
        run: |
          bash scripts/ci_probe.sh 2>&1 | tee "$HOME/ci_probe.log"
      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-probe-log-a100
          path: ${{ env.HOME }}/ci_probe.log
          retention-days: 2
  lbl-ernie8gpu:
    runs-on: [self-hosted, ernie-8gpu]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: deploy
        run: |
          bash scripts/ci_probe.sh 2>&1 | tee "$HOME/ci_probe.log"
      - name: upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-probe-log-ernie8gpu
          path: ${{ env.HOME }}/ci_probe.log
          retention-days: 2