name: ci-docs-lint
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  lbl-ernie8gpu:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: [self-hosted, ernie-8gpu]
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - name: deploy
        run: bash scripts/ci_pearl6022.sh