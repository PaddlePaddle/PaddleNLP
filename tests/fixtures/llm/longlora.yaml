lora:
  base:
    dataset_name_or_path: "./autoregressive_data"
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    per_device_eval_batch_size: 1
    eval_accumulation_steps: 16
    num_train_epochs: 3
    learning_rate: 3e-04
    warmup_steps: 30
    logging_steps: 1
    evaluation_strategy: "epoch"
    save_strategy: "epoch"
    src_length: 1024
    max_length: 2048
    fp16: true
    fp16_opt_level: "O2"
    do_train: true
    do_eval: true
    disable_tqdm: true
    load_best_model_at_end: true
    eval_with_do_generation: false
    metric_for_best_model: "accuracy"
    recompute: true
    refined_recompute: "flash_attn:-1"
    save_total_limit: 1
    tensor_parallel_degree: 1
    pipeline_parallel_degree: 1
    lora: true
    autoregressive: true
    use_long_sequence_strategies: true
    strategy_type: "embedding_strategies"
    strategy_name: "LinearScalingRotaryEmbedding"
    rope_scaling_factor: 4
    use_ssa: true
    ssa_group_size_ratio: 0.25

  default:
    llama:
      model_name_or_path: __internal_testing__/tiny-random-llama


inference-predict:
  default:
    mode: dynamic 
    max_length: 20
    batch_size: 2
    decode_strategy: greedy_search
    dtype: float16

inference-to-static:
  default:
    dtype: float16
    max_length: 20

inference-infer:
  default:
    mode: static
    dtype: float16
    batch_size: 2
    decode_strategy: greedy_search
    max_length: 20
